apiVersion: apps/v1
kind: Deployment
metadata:
  name: anomaly-demo-app
  labels:
    app: anomaly-demo-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: anomaly-demo-app
  template:
    metadata:
      labels:
        app: anomaly-demo-app
    spec:
      containers:
        - name: api
          image: anomaly-demo-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: anomaly-demo-app
spec:
  selector:
    app: anomaly-demo-app
  ports:
    - port: 80
      targetPort: 8080
  type: NodePort
